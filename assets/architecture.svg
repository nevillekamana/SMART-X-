<svg xmlns='http://www.w3.org/2000/svg' width='900' height='420' viewBox='0 0 900 420'>
  <style>text{font-family:Segoe UI, Arial, sans-serif;fill:#222}</style>
  <rect x='20' y='20' width='860' height='380' rx='10' fill='#fff' stroke='#ddd'/>
  <text x='40' y='50' font-size='18' font-weight='700'>HustleHub+ (Smart-X) — Architecture Overview</text>

  <!-- Frontend -->
  <rect x='40' y='80' width='200' height='80' rx='8' fill='#f7fbf6' stroke='#cfe6d0'/>
  <text x='70' y='110' font-size='14'>Frontend</text>
  <text x='70' y='130' font-size='12' fill='#666'>Static HTML/JS (wwwroot)</text>

  <!-- API -->
  <rect x='320' y='80' width='240' height='120' rx='8' fill='#fbfbff' stroke='#d6d7f2'/>
  <text x='350' y='110' font-size='14'>API / Minimal App</text>
  <text x='350' y='130' font-size='12' fill='#666'>ASP.NET Core 10 (Minimal API)</text>

  <!-- Services -->
  <rect x='620' y='80' width='220' height='150' rx='8' fill='#fff9f6' stroke='#f2d9c9'/>
  <text x='650' y='110' font-size='14'>Validation & Services</text>
  <text x='650' y='130' font-size='12' fill='#666'>TelemetryService, FileUploadService</text>
  <text x='650' y='148' font-size='12' fill='#666'>DeploymentValidationService</text>

  <!-- arrows -->
  <line x1='240' y1='120' x2='320' y2='120' stroke='#bbb' stroke-width='2' marker-end='url(#arrow)' />
  <line x1='560' y1='120' x2='620' y2='120' stroke='#bbb' stroke-width='2' marker-end='url(#arrow)' />

  <defs>
	<marker id='arrow' markerWidth='10' markerHeight='10' refX='6' refY='5' orient='auto'>
	  <path d='M0,0 L10,5 L0,10 z' fill='#bbb' />
	</marker>
  </defs>

  <!-- Storage / Batches -->
  <rect x='320' y='220' width='240' height='80' rx='8' fill='#f5f7ff' stroke='#dde3ff'/>
  <text x='350' y='250' font-size='14'>In-memory Storage</text>
  <text x='350' y='270' font-size='12' fill='#666'>Jagged-array batches → consolidated List</text>

  <line x1='440' y1='200' x2='440' y2='220' stroke='#bbb' stroke-width='2' marker-end='url(#arrow)' />

  <!-- Legend -->
  <text x='40' y='360' font-size='12' fill='#444'>Flow: Frontend → API → Validation/Security → Services → Telemetry/Storage</text>
</svg>
